<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leave Portal</title>
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
</head>
<body>

<div id="signinScreen" class="signin-screen">
  <h1>Employee Leave Portal</h1>
  <p class="muted">Sign in with your Microsoft 365 work account.</p>
  <button id="signInBtn">Sign in with Microsoft</button>
  <p id="signinError" class="error"></p>
</div>

<div id="appScreen" class="hidden">
  <header>
    <h1>Leave Portal</h1>
    <div>
      <span id="userName" style="margin-right:16px;"></span>
      <a id="adminLink" href="admin.html" class="hidden" style="color:white;margin-right:16px;">Admin dashboard</a>
      <button id="signOutBtn">Sign out</button>
    </div>
  </header>

  <main>
    <div class="card">
      <h2>Your leave balance</h2>
      <div class="balances" id="balancesGrid"></div>
    </div>

    <div class="card">
      <h2>Apply for leave</h2>
      <form id="leaveForm">
        <label>Leave type</label>
        <select id="leaveType" required></select>

        <label>Start date</label>
        <input type="date" id="startDate" required />

        <label>End date</label>
        <input type="date" id="endDate" required />

        <label>Reason</label>
        <textarea id="reason" rows="3" placeholder="Brief reason for your manager"></textarea>

        <p class="muted" id="daysPreview"></p>
        <button type="submit">Submit request</button>
        <p id="formError" class="error"></p>
        <p id="formSuccess" class="muted"></p>
      </form>
    </div>

    <div class="card">
      <h2>Your requests</h2>
      <table>
        <thead>
          <tr><th>Type</th><th>Dates</th><th>Days</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="requestsBody"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="data/india-holidays-2026.js"></script>
<script src="js/dates.js"></script>
<script src="js/auth.js"></script>
<script src="js/graph.js"></script>
<script src="js/app.js"></script>
</body>
</html>
